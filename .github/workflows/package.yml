name: Empaquetar ParkSmart
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear ZIP
        run: zip -r ParkSmart-Proyecto-Integrador-I.zip . -x '.git/*'
      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ParkSmart-Proyecto-Integrador-I
          path: ParkSmart-Proyecto-Integrador-I.zip
